<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>SendVybe - Replies to your cold email, handled</title>
    <meta
      name="description"
      content="SendVybe reads replies to your outbound, drafts answers from your knowledge base, books meetings on Google Calendar, and holds anything uncertain for a person."
    />
    <script>
      // Set the theme before first paint so dark mode does not flash light. App routes only.
      (function () {
        try {
          var p = location.pathname;
          if (p !== "/app" && p.indexOf("/app/") !== 0) return;
          var t = localStorage.getItem("sendvybe.theme");
          if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.classList.toggle("dark", t === "dark");
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
